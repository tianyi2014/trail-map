name: Rename uploaded file to index.html
on:
  push:
    paths:
      - .github/workflows/rename.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          git config user.name "tianyi2014"
          git config user.email "tianyi2014@users.noreply.github.com"
          git mv bei-da-hu-xue-dao-shi-ce-tu-xun-cha-ji-lu.html index.html
          git commit -m "Add E lift (E索, estimated from official trail map)"
          git push
