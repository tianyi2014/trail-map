name: Rename uploaded file to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git mv bei-da-hu-xue-dao-shi-ce-tu-xun-cha-ji-lu.html index.html
          git config user.name "tianyi2014"
          git config user.email "tianyi2014@users.noreply.github.com"
          git commit -m "Add 5 missing E-lift-area trail polygons (total 43)"
          git push
